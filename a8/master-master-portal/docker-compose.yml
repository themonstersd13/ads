services:
  mm-node1:
    image: postgres:16
    container_name: mm-node1
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=20
      - -c
      - max_replication_slots=20
    ports:
      - "5541:5432"
    volumes:
      - mm_node1_data:/var/lib/postgresql/data
    networks:
      - mm_net

  mm-node2:
    image: postgres:16
    container_name: mm-node2
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=20
      - -c
      - max_replication_slots=20
    ports:
      - "5542:5432"
    volumes:
      - mm_node2_data:/var/lib/postgresql/data
    networks:
      - mm_net

  mm-node3:
    image: postgres:16
    container_name: mm-node3
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=20
      - -c
      - max_replication_slots=20
    ports:
      - "5543:5432"
    volumes:
      - mm_node3_data:/var/lib/postgresql/data
    networks:
      - mm_net

volumes:
  mm_node1_data:
  mm_node2_data:
  mm_node3_data:

networks:
  mm_net:
    driver: bridge
